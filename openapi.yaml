openapi: 3.0.3
info:
  title: Centavo BFF
  version: 1.0.0
  description: |
    Contrato entre a UI (`centavo-frontend`) e o BFF. É a fonte da verdade do salto
    FE↔BFF: o frontend gera os tipos a partir dele (C17).

    O BFF expõe **só o que a UI usa**. Os schemas de domínio vêm do contrato do Spring
    (`contracts/backend.openapi.yaml`, cópia sincronizada por `npm run contract:sync`);
    aqui ficam só as rotas e os view-models próprios do BFF.

    **Autenticação (provisória até o C16):** o header `Authorization: Bearer <token>` é
    repassado ao Spring sem alteração. No C16 ele dá lugar à sessão em cookie httpOnly.

    **Erros:** RFC 7807 com `code` estável. Os erros do Spring passam intactos (status,
    corpo e `code`); o BFF só acrescenta `UPSTREAM_UNAVAILABLE`, quando o Spring não
    responde.
servers:
  - url: http://localhost:3000
    description: Execução local
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Cadastro e autenticação
  - name: Accounts
    description: Contas do usuário
  - name: Categories
    description: Categorias de receita e despesa
  - name: Transactions
    description: Lançamentos
  - name: Dashboard
    description: Tela inicial

paths:
  /bff/users/register:
    post:
      tags: [Users]
      operationId: register
      summary: Cadastra um novo usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/backend.openapi.yaml#/components/schemas/UserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: './contracts/backend.openapi.yaml#/components/schemas/UserRegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /bff/users/login:
    post:
      tags: [Users]
      operationId: login
      summary: Autentica o usuário e devolve o JWT
      description: Provisório — no C16 passa a abrir a sessão em cookie e deixa de devolver o token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/backend.openapi.yaml#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: './contracts/backend.openapi.yaml#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /bff/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Lista as contas do usuário
      responses:
        '200':
          description: Contas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './contracts/backend.openapi.yaml#/components/schemas/AccountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Cria uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/backend.openapi.yaml#/components/schemas/AccountRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: './contracts/backend.openapi.yaml#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /bff/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Lista as categorias do usuário
      responses:
        '200':
          description: Categorias do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './contracts/backend.openapi.yaml#/components/schemas/CategoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/backend.openapi.yaml#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: './contracts/backend.openapi.yaml#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /bff/transactions:
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Cria um lançamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/backend.openapi.yaml#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Lançamento criado
          content:
            application/json:
              schema:
                $ref: './contracts/backend.openapi.yaml#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /bff/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Tudo o que a tela inicial precisa, numa chamada
      description: |
        Agrega, em paralelo, o resumo do mês, os lançamentos recentes e o resumo por conta.
        Se qualquer uma das chamadas ao Spring falhar, devolve o erro dela.
      responses:
        '200':
          description: View-model do dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Problem:
      description: Erro de domínio repassado do Spring (ver o `code`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Corpo inválido ou ilegível (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Token ausente, inválido ou expirado (sem corpo)
    UpstreamUnavailable:
      description: O Spring não respondeu a tempo ou está fora do ar (`UPSTREAM_UNAVAILABLE`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    DashboardView:
      type: object
      required: [summary, recentTransactions, accounts]
      properties:
        summary:
          $ref: './contracts/backend.openapi.yaml#/components/schemas/DashboardSummaryResponse'
        recentTransactions:
          type: array
          items:
            $ref: './contracts/backend.openapi.yaml#/components/schemas/RecentTransactionResponse'
        accounts:
          type: array
          items:
            $ref: './contracts/backend.openapi.yaml#/components/schemas/AccountSummaryResponse'

    Problem:
      type: object
      description: Erro no formato RFC 7807 (`application/problem+json`)
      required: [status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Detalhe técnico opcional, para debug — não exibir ao usuário
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: './contracts/backend.openapi.yaml#/components/schemas/FieldError'

    ErrorCode:
      type: string
      description: Os códigos do Spring mais os do próprio BFF.
      enum:
        - ACCOUNT_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - TRANSACTION_NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - TRANSACTION_CATEGORY_TYPE_MISMATCH
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - UPSTREAM_UNAVAILABLE
